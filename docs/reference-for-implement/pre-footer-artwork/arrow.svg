<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 40" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Source shape for the Pre-Footer CTA "pointer field" decoration (Design A).
    Default orientation: pointing right (east), tip at x=100.
    Placed instances rotate this shape to aim toward the CTA center — see
    design-a-spec.md for the angle convention (rotation = polar angle + 180°).
    Single flat line + open chevron head, no fill areas, so it reads as a
    hairline "pointer" consistent with the site's flat/no-shadow component
    language (ARCHITECTURE.md §4).
  -->
  <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="2" y1="20" x2="78" y2="20" />
    <polyline points="58,4 96,20 58,36" />
  </g>
</svg>
